name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: find backend/src backend/scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Upload marketplace build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-dist
          path: frontend/apps/marketplace/dist
          if-no-files-found: error
      - name: Publish marketplace static branch
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/buysell-marketplace-dist
          cp -R frontend/apps/marketplace/dist /tmp/buysell-marketplace-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vercel-static
          git rm -rf .
          git clean -fdx
          cp -R /tmp/buysell-marketplace-dist/. .
          touch .nojekyll
          git add .
          git commit -m "Publish marketplace static build ${GITHUB_SHA}"
          git push --force origin vercel-static
