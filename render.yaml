services:
  - type: web
    name: buysell-api-v1-2
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buysell-postgres-v1-2
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AD_PRICE_KOBO
        value: 500000
      - key: PUBLIC_MARKETPLACE_URL
        value: https://buysell-marketplace-v1-2.vercel.app
      - key: CORS_ORIGINS
        value: https://buysell-marketplace-v1-2.vercel.app,https://buysell-landing-v1-2.vercel.app
      - key: STORAGE_DRIVER
        value: local
      - key: PUBLIC_UPLOAD_BASE_URL
        value: https://buysell-api-v1-2.onrender.com/uploads

databases:
  - name: buysell-postgres-v1-2
    plan: free
    region: frankfurt
    databaseName: buysell_postgres_v1_2
    user: buysell_postgres_v1_2_user
